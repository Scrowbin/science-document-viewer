# Pyrefly configuration for DACNTT monorepo
python-version = "3.11"
python-platform = "windows"
python-interpreter-path = ".venv/Scripts/python.exe"

site-package-path = [
    ".venv/Lib/site-packages",
    "backend/venv/Lib/site-packages"
]

search-path = [
    "backend",
    "backend/scripts",
    "eval",
    "eval/phases/phase_0_baseline/scripts",
    "eval/phases/phase_3_embedding/scripts",
    "eval/phases/phase_4_indexing/scripts",
    "eval/phases/phase_5_query_processing/scripts",
    "eval/phases/phase_6_hybrid_retrieval/scripts"
]
