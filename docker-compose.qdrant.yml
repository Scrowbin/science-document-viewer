version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: science_doc_qdrant_server
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP / REST API
      - "6334:6334"  # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
      - QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS=2
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - ./media/qdrant_server_db:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
        reservations:
          cpus: '4.0'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
